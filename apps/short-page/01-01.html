<style>
:root,[data-theme="day"]{

/* the check strip: what a marker points at */
.strip{position:fixed;left:50%;bottom:1.1rem;transform:translate(-50%,150%);z-index:40;
  width:min(40rem,calc(100vw - 2.5rem));background:var(--chip);border:1px solid var(--chip-bd);
  border-radius:12px;padding:.85rem 1.1rem;box-shadow:var(--shadow);opacity:0;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.strip.show{transform:translate(-50%,0);opacity:1}
.strip .h{font-family:'Inter',sans-serif;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);display:flex;justify-content:space-between;margin-bottom:.35rem}
.strip .h b{color:var(--faint);font-weight:400;cursor:pointer}
.strip .m{font-family:'Tiro Devanagari Marathi',serif;font-size:.98rem;line-height:1.85;margin:0}
.strip .e{margin:.35rem 0 0;font-style:italic;font-size:.88rem;line-height:1.5;color:var(--soft)}

@media print{

<script>
const DATA = {"id": "01-01", "date": {"day": 1, "month": 1, "label_mr": "१ जानेवारी", "label_en": "1 January"}, "title_mr": "परमात्मस्वरूपच असणारें नाम", "title_en": "The Name That Is Itself the Supreme Reality", "footnote": {"marker": "१", "mr": "ज्याची प्रत्येक कृति रामाच्या स्मरणामध्यें होते तोच रामराज्यांत खरा राहतो.", "en": "He whose every act is done in remembrance of Rama is the one who truly dwells in Rama's kingdom."}, "paras": [[1, 10], [11, 15], [16, 19], [20, 23]], "sentences": [[1, "नाम म्हणजे भगवंताचें नांव.", "\"Nama\" means the Name of God.", 0], [2, "देवाच्या कोणत्याहि नांवांत फरक नाहीं.", "There is no difference between any of God's names.", 0], [3, "नाम हा जीव आणि शिव यांमधील दुवा आहे.", "The Name is the link between the individual soul (jiva) and God (Shiva).", 1], [4, "नाम हें साध्य आहे व साधनहि आहे.", "The Name is both the goal and the means to it.", 1], [5, "नाम सगुण आहे आणि निर्गुणहि आहे.", "The Name is saguna (God with form and attributes) and also nirguna (formless, attributeless).", 1], [6, "नामाचा आरंभ सगुणांत आहे व शेवट निर्गुणांत आहे.", "The Name begins in the saguna and ends in the nirguna.", 1], [7, "आरंभ सगुणांत आहे असें म्हणण्याचें कारण हें कीं, भगवंत मुळांत जो निराकार, निर्गुण आहे, तो जेव्हां सगुणांत आला तेव्हांच त्याला नाम-रूप लागलें;", "It is said to begin in the saguna because God, who is originally formless and without attributes, acquired name and form only when He assumed a manifest form;", 1], [8, "व सगुणरूप नाहींसें झालें तरी नाम शिल्लकच राहिलें, म्हणून तें निर्गुणहि आहे.", "and even when that form dissolves, the Name remains — which is why it is nirguna as well.", 1], [9, "तेव्हां सगुण किंवा निर्गुण भक्तीला नामाचाच आधार आहे.", "So whether devotion is to the formed or the formless, its support is the Name alone.", 0], [10, "नाम हा सत्संगाचा पाया आहे व कळसहि आहे.", "The Name is both the foundation of satsang and its crowning pinnacle.", 0], [11, "नाम म्हणजे आपली वृत्ति आणि भगवंत यांना जोडणारी सांखळीच आहे.", "The Name is the very chain that joins our inner disposition to God.", 1], [12, "लग्न झाल्यावर स्त्री जशी नवऱ्याशीं एकरूप होऊन जाते, त्याप्रमाणें वृत्तीचें नामाशीं लग्न होऊन ती नामरूप बनली पाहिजे.", "Just as a wife becomes one with her husband after marriage, our disposition must be wedded to the Name until it takes the Name's own form.", 1], [13, "अन्नाला स्वतःची चव असते; त्याच्यामध्यें आपण आपली गोडी व आवड घालून नंतर तें आपण खातों.", "Food has a taste of its own; we add our own relish and liking to it and then eat it.", 1], [14, "पण नामाला स्वतःची अशी चव नाहीं. त्याच्यामध्यें आपणच आपली गोडी घालून तें घेतलें पाहिजे.", "But the Name has no such taste of its own. We ourselves must put our sweetness into it and then take it.", 0], [15, "आपण जितकी जास्त गोडी त्यामध्यें घालूं तितकें तें अधिक गोड वाटेल.", "The more sweetness we pour into it, the sweeter it will taste.", 0], [16, "पंढरपूरला जाण्यास पुष्कळ रस्ते आहेत; परंतु सर्वांना शेवटीं “बारींतून” जाऊनच देवदर्शन घ्यावें लागतें.", "There are many roads to Pandharpur; but in the end everyone must pass through the same narrow queue to have darshan of God.", 0], [17, "त्याप्रमाणें, इतर साधनें जरी केलीं तरी नामसाधन केल्यावरच आत्मस्वरूपाची प्राप्ति होते.", "In the same way, whatever other practices one may follow, realisation of one's true Self comes only through the practice of the Name.", 1], [18, "आपण नाम घ्यावें, तें आपणच आपल्या कानांनीं ऐकावें, आणि तें घेतां घेतां त्यांत शेवटीं स्वतःला विसरून जावें, हाच नामसाधनेंतील आनंदाचा मार्ग आहे.", "Take the Name, hear it with your own ears, and while taking it, at last forget yourself in it — this is the path of joy in the practice of the Name.", 1], [19, "जसें आपलें आपलेपण आपल्या नांवांत आहे, तसें देवाचें देवपण त्याच्या नामांत आहे.", "Just as our own selfhood lives in our name, so God's godhood lives in His Name.", 1], [20, "आपण आज जें नाम घेतों तेंच नाम कायम राहतें; परंतु आपली देहबुद्धि जसजशी कमी होईल तसतसें तें नाम व्यापक व अर्थगर्भ बनत जातें, आणि शेवटीं नाम हें परमात्मस्वरूपच आहे असा अनुभव येतो.", "The Name we take today stays the same; but as body-consciousness thins, that Name grows vaster and more laden with meaning, until at last one experiences that the Name is itself the Supreme Reality.", 0], [21, "पाणी हें जसें शरीराचें जीवन आहे, तसें नाम हें मनाचें “जीवन” बनलें पाहिजे.", "As water is the life of the body, so must the Name become the “life” of the mind.", 1], [22, "अंतकाळीं अगदीं शेवटीं सुटणारी वस्तु म्हणजे भगवंताचें नाम पाहिजे. नामांत शेवटचा श्वास गेला पाहिजे.", "At the end of life, the very last thing to leave us should be God's Name. The final breath should go out in the Name.", 1], [23, "नामांत एका आनंदाशिवाय दुसरें कांहीं नाहीं.", "In the Name there is nothing but bliss.", 0]], "groups": {"5": 1, "6": 1, "7": 2, "8": 2, "11": 3, "12": 3}, "points": [["नाम = साध्य + साधन", "The Name is both the goal and the means — nothing further is needed beyond it.", 4], ["जीव–शिव दुवा", "The Name is the link between the soul and God; it is the chain that binds our disposition to Him.", 3], ["सगुण ते निर्गुण", "The Name starts with form and ends in the formless — it outlives form itself, so it serves every kind of devotion.", 6], ["गोडी आपणच घालायची", "The Name has no taste of its own; the sweetness you put in is the sweetness you get out.", 13], ["“बारीं” शिवाय दर्शन नाही", "Many roads, one final gate: other practices may help, but Self-realisation comes only through the Name.", 17], ["घ्या, ऐका, विसरा", "The method in one line — say the Name, hear it yourself, and lose yourself in it.", 18], ["मनाचें जीवन", "Make the Name the life of the mind, as water is the life of the body.", 21], ["शेवटचा श्वास नामांत", "Let the Name be the last thing to leave you — the final breath should go out in it.", 22]], "page_image": "source/pages/01-01.jpg"};
</script>
<script>
const SUMMARY = {"id": "01-01", "status": {"state": "draft", "author": null, "reviewed_by_marathi_editor": false, "reviewed_by_publisher": false, "note": "Marathi connective prose is machine-drafted and needs a native editor. English is a draft."}, "essay": [{"lead": true, "mr": "<span class=\"mr\">नाम</span> म्हणजे भगवंतापर्यंत पोंचण्याचें केवळ साधन नव्हे. <strong>नाम हा जीव आणि शिव यांमधील दुवा आहे</strong>{{3}} — या एका वाक्यानें पुढचें सगळें बदलून जातें.", "en": "<span class=\"mr\">नाम</span> — the Name — is not a technique for reaching God. <strong>It is the link itself</strong>{{3}}. That one claim rearranges everything that follows."}, {"mr": "दुवाच जर नाम आहे, तर तें वाटेवरचें कांहीं नाहीं. <strong>नाम हें साध्य आहे व साधनहि आहे</strong>{{4}}. म्हणून पुढें पोंचण्यासारखें दुसरें कांहीं उरत नाहीं.", "en": "If the Name is the bridge between you and God, it is not something you do on the way to somewhere else. It is <strong>both the goal and the means</strong>{{4}} — <span class=\"mr\">साध्य आणि साधन</span> — at once. There is nothing further to arrive at."}, {"mr": "रूप डोळ्यांपुढें आणतां आलें पाहिजे, असेंहि नाहीं. निराकार सगुणांत आला तेव्हां त्याला नाम-रूप लागलें; <strong>सगुणरूप नाहींसें झालें तरी नाम शिल्लकच राहिलें</strong>{{7}}. म्हणून सगुण भक्तालाहि आणि निर्गुण भक्तालाहि आधार तोच. आणि हा दुवा नव्यानें बांधावा लागत नाहीं — <strong>नाम ही आपली वृत्ति आणि भगवंत यांना जोडणारी सांखळीच आहे</strong>{{11}}; ती आपण उचललेली नसते, एवढेंच.", "en": "Nor does it depend on your being able to picture anything. The Name arose when the formless took form; when the form dissolved, <strong>the Name remained</strong>{{7}}. So it holds for the devotee who needs an image and equally for the one who needs none. And it is not a rope you must throw across a gap — it is <strong>a chain already joining you to Him</strong>{{11}}, which you have simply not picked up."}, {"mr": "इथेंच बहुतेकजण थांबतात — आधीं कांहीं वाटलें पाहिजे, अशी वाट पाहत. हें पान तें कारण अगदीं साध्या उदाहरणानें काढून टाकतें.", "en": "Here is where most of us stop: waiting to feel something first. This page removes that excuse with an entirely ordinary comparison."}, {"pull": 13}, {"mr": "अन्नाला स्वतःची चव असते; आपण आपली गोडी घालून मग तें खातों. <strong>नामाला स्वतःची अशी चव नाहीं</strong>{{13}}. त्यांतली गोडी आपणच घातलेली असते — आणि जितकी घालूं तितकी ती वाढते. म्हणून जी ओढ आपण वाट पाहत होतों, ती आधीं येणारी नव्हतीच. ती नंतर येते.", "en": "Food arrives with a taste of its own; you bring your liking to it and then you eat. The Name has <strong>no taste of its own</strong>{{13}}. The sweetness in it is the sweetness you put there — and it grows sweeter exactly in proportion to what you bring. So the feeling you were waiting for was never going to arrive first. It arrives second."}, {"mr": "कृति तीन शब्दांची आहे. <strong>नाम घ्यावें, तें आपणच आपल्या कानांनीं ऐकावें, आणि तें घेतां घेतां त्यांत स्वतःला विसरून जावें</strong>{{18}}. एवढेंच सांगितलें आहे — आणि इथें कान मागितले आहेत, एकाग्रता नव्हे. तें आपल्याला ऐकूं येईल इतकें असावें.", "en": "The method is three words long. <strong>Say it. Hear it with your own ears. Go on until you forget yourself in it.</strong>{{18}} That is the whole instruction — and note that it asks for your ears, not your concentration. It is meant to be audible to you."}, {"mr": "असें पुष्कळ वेळां घडलें कीं तें करण्याची क्रिया राहत नाहीं. <strong>पाणी जसें शरीराचें जीवन, तसें नाम मनाचें जीवन बनलें पाहिजे</strong>{{21}} — सकाळीं करावयाची गोष्ट नव्हे; ज्यांत राहावयाचें तें.", "en": "Do that often enough and it stops being an activity you perform. Water is the life of the body; <strong>the Name is to become the life of the mind</strong>{{21}}. Not something done in the morning. Something lived in."}, {"mr": "आणि शेवटीं तें कठीण पण स्पष्ट वाक्य — जें जें सुटत जातें त्यांत <strong>अगदीं शेवटीं सुटणारी वस्तु म्हणजे भगवंताचें नाम पाहिजे</strong>{{22}}.", "en": "And then the plain, difficult ending the page builds toward: of everything that falls away at the end, <strong>let this be the last to go</strong>{{22}}."}, {"mr": "म्हणून सुरुवात कधीं करावी, हा प्रश्नच उरत नाहीं. शेवटचा श्वास नामांत जावयाचा असेल, तर आजचा प्रत्येक जप त्याचीच तयारी आहे. नंतर सुरू होणारी अशी ही साधना नाहीं.", "en": "Which settles the question of when to begin. If the last breath is to go out in the Name, then every repetition made today is the rehearsal for it. There is no version of this practice that starts later."}], "begin_today": {"heading_mr": "आजची सुरुवात", "heading_en": "begin today", "steps": [{"word": "घ्या", "mr": "नाम घ्यावें — एकदां, हळू आवाजांत.", "en": "Say the Name — once, aloud and quietly."}, {"word": "ऐका", "mr": "तें आपल्याच कानांनीं ऐकावें.", "en": "Hear it in your own ears. Audible to you."}, {"word": "विसरा", "mr": "घेतां घेतां त्यांत स्वतःला विसरून जावें.", "en": "Stay with it until you forget yourself in it."}], "close_mr": "तयारी कांहीं नाहीं, शिकावें कांहीं नाहीं, ठराविक जागाहि नाहीं. गोडी आपण घालायची; चव मागून येते.", "close_en": "Nothing to prepare, nothing to learn, no place you must be. You supply the liking; the sweetness follows."}, "practice_actions": [{"sentence": 18, "today": "Say it once aloud, quietly, so that your own ears hear it. Not silently — audibly enough to be heard by you."}, {"sentence": 13, "today": "Do not wait to feel anything. Bring the liking with you; the sweetness is what you put in, not what you find."}, {"sentence": 12, "today": "Take it into ordinary work — walking, cooking, waiting — not only into the time you set aside."}, {"sentence": 17, "today": "Keep whatever else you already do. Add this; do not exchange it for this."}, {"sentence": 21, "today": "Return to it as often as you drink water today. Frequency, not duration."}, {"sentence": 22, "today": "Let it be the last thing before sleep, as a rehearsal of the last thing before the end."}, {"sentence": "fn", "today": "Choose one ordinary task today and do that one task in remembrance."}]};
</script>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dev=n=>String(n).replace(/\d/g,d=>'०१२३४५६७८९'[d]);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
             set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const byN={}; DATA.sentences.forEach(([n,mr,en,hl])=>byN[n]={mr,en,hl});

document.getElementById('dl').textContent=DATA.date.label_mr+'  ·  '+DATA.date.label_en;
document.getElementById('tmr').textContent=DATA.title_mr;
document.getElementById('ten').textContent=DATA.title_en;

/* The summary text lives in summary/days/<id>.json and is injected at build time.
   {{n}} in that text becomes a tappable source marker pointing at sentence n. */
const mark=h=>h.replace(/\{\{(\d+)\}\}/g,(_,n)=>`<i class="src" data-s="${n}">${n}</i>`);
const ESSAY=SUMMARY.essay.map(p=>p.pull?{pull:p.pull}:{lead:p.lead,mr:mark(p.mr),en:mark(p.en)});

const essayEl=document.getElementById('essay');
function renderEssay(){
  const mr=document.body.dataset.lang==='mr';
  essayEl.innerHTML=ESSAY.map(p=>{
    if(p.pull){
      const s=byN[p.pull];
      return `<div class="pull"><span class="q">${esc(s.mr)}</span>
              <span class="t">${esc(s.en)}</span></div>`;
    }
    const main=mr?p.mr:p.en, other=mr?p.en:p.mr;
    const strip=h=>h.replace(/<i class="src"[^>]*>\d+<\/i>/g,'');
    return `<p class="${p.lead?'lead':''}">${main}</p><p class="tr">${strip(other)}</p>`;
  }).join('');
}
/* every marker must point at a sentence that is actually underlined */
function audit(){
  const used=[...document.querySelectorAll('.src')].map(e=>+e.dataset.s);
  const bad=used.filter(n=>!byN[n]||!byN[n].hl);
  const mr=document.body.dataset.lang==='mr';
  document.getElementById('who').innerHTML = mr
   ? `<b>या आवृत्तीसाठीं लिहिलेलें.</b> हा सारांश आहे, प्रवचन नव्हे — ${dev(used.length)} मुद्दे,
      प्रत्येक एका अधोरेखित वाक्यावरून; अंक दाबल्यास मूळ वाक्य दिसतें. जोडणारीं वाक्यें आमचीं आहेत.
      मसुदा · नाव नाहीं · मराठी जाणकारानें वा प्रकाशकानें तपासलेलें नाहीं.
      ${bad.length?'<br><b>इशारा:</b> '+bad.length+' अंक अधोरेखित नसलेल्या मजकुराकडे बोट दाखवतो.':''}
      <br>पूर्ण प्रवचन ${dev(DATA.sentences.length)} वाक्यांचें आहे; तें आधीं वाचावें.`
   : `<b>Written for this edition.</b> This is a summary, not the discourse — ${used.length}
      claims, each drawn from a passage a previous reader underlined, marked with a number you can
      tap to see the original. The connecting sentences are ours. Draft · unattributed ·
      not reviewed by a Marathi scholar or by the publisher.
      ${bad.length?'<br><b>Warning:</b> '+bad.length+' marker(s) cite text that is not underlined.':''}
      <br>The full discourse is ${DATA.sentences.length} sentences; read it before this.`;
}
function renderChrome(){
  const mr=document.body.dataset.lang==='mr';
  const st=SUMMARY.begin_today.steps;
  document.querySelectorAll('.step').forEach((el,i)=>{
    if(!st[i])return;
    el.querySelector('b').textContent=st[i].word;
    el.querySelector('span').textContent=mr?st[i].mr:st[i].en;});
  document.getElementById('closeP').textContent = mr
   ? SUMMARY.begin_today.close_mr : SUMMARY.begin_today.close_en;
}
function render(){renderEssay();renderChrome();audit();}

const strip=document.getElementById('strip');
document.getElementById('stripX').onclick=()=>{strip.classList.remove('show');
  document.querySelectorAll('.src.on').forEach(e=>e.classList.remove('on'))};
document.addEventListener('click',e=>{
  const m=e.target.closest('.src'); if(!m) return;
  const s=byN[m.dataset.s]; if(!s) return;
  document.querySelectorAll('.src.on').forEach(x=>x.classList.remove('on'));
  m.classList.add('on');
  document.getElementById('stripH').textContent='वाक्य '+dev(m.dataset.s)+' · sentence '+m.dataset.s+
    (s.hl?' · underlined':'');
  document.getElementById('stripM').textContent=s.mr;
  document.getElementById('stripE').textContent=s.en;
  strip.classList.add('show');
});

const THEMES=['day','sepia','night'];
function setTheme(t){document.documentElement.dataset.theme=t;store.set('pravachane-theme',t)}
setTheme(store.get('pravachane-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'));
document.getElementById('bTheme').onclick=()=>
  setTheme(THEMES[(THEMES.indexOf(document.documentElement.dataset.theme)+1)%3]);
document.getElementById('lang').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.body.dataset.lang=b.dataset.lang;
  document.querySelectorAll('#lang button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  strip.classList.remove('show'); render();
});
document.getElementById('bTr').onclick=e=>{
  const on=document.body.dataset.tr==='off';
  document.body.dataset.tr=on?'on':'off'; e.target.classList.toggle('on',on)};
document.getElementById('bSrc').onclick=e=>{
  const on=document.body.dataset.src==='off';
  document.body.dataset.src=on?'on':'off'; e.target.classList.toggle('on',on)};
document.getElementById('bPrint').onclick=()=>print();
addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')document.getElementById('bTheme').click()});

render();
(function(){const q=new URLSearchParams(location.search);
  if(q.get('theme'))setTheme(q.get('theme'));
  if(q.get('lang')==='en')document.querySelector('#lang button[data-lang="en"]').click();
  if(q.get('tr')==='on')document.getElementById('bTr').click();})();
</script>
</body>
</html>
