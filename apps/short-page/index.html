<style>
:root,[data-theme="day"]{

[data-theme="night"]{
  --desk:#0a0908;--paper:#16130f;--bd:#2a241d;--ink:#ece5d8;--soft:#9a9082;--faint:#6a6154;
  --rule:#2c261f;--gold:#d9a45b;--ember:#c07a44;--wash:#2e2214;--chip:#1b1712;--chip-bd:#2f2820;

*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:'EB Garamond',Georgia,serif;
  font-size:19px;-webkit-font-smoothing:antialiased;padding:0 1.25rem 5rem;
  transition:background .45s,color .45s}
.ui{font-family:'Inter',system-ui,sans-serif}
button{font-family:'Inter',system-ui,sans-serif;cursor:pointer}

.bar{max-width:40rem;margin:0 auto;padding:.75rem 0;display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.brand{font-family:'Tiro Devanagari Marathi',serif;font-size:1rem;line-height:1.1}
.brand small{display:block;font-family:'Inter',sans-serif;font-size:.55rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint)}
.grow{flex:1}
.btn{font-size:.7rem;font-weight:500;color:var(--soft);background:var(--chip);border:1px solid var(--chip-bd);
  border-radius:999px;padding:.36rem .7rem;transition:.18s;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.on{background:var(--gold);border-color:var(--gold);color:var(--on-fg)}
.seg{display:flex;background:var(--chip);border:1px solid var(--chip-bd);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;color:var(--soft);border-radius:999px;
  font-size:.7rem;font-weight:500;padding:.3rem .7rem;transition:.18s}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-fg)}

.sheet{max-width:40rem;margin:.5rem auto 0;background:var(--paper);border:1px solid var(--bd);
  border-radius:3px;box-shadow:var(--shadow);padding:3.4rem 3.2rem 2.4rem;transition:background .45s}
@media(max-width:640px){.sheet{padding:2rem 1.4rem 1.6rem}body{font-size:18px}}

.dl{font-family:'Inter',sans-serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin-bottom:.9rem}
h1{font-family:'Tiro Devanagari Marathi',serif;font-weight:400;font-size:1.75rem;line-height:1.4;margin:0 0 .15rem}
.sub{font-style:italic;color:var(--soft);margin:0;font-size:.95rem}
.orn{display:flex;align-items:center;gap:.8rem;color:var(--gold);margin:1.7rem 0 1.9rem}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:var(--rule)}

/* the essay */
.essay p{margin:0 0 1.25rem;line-height:1.72}
.essay p.lead{font-size:1.12em;line-height:1.6}
.mr{font-family:'Tiro Devanagari Marathi',serif;color:var(--ink);font-size:1.02em;

strong{font-weight:400;color:var(--ink);background:linear-gradient(180deg,transparent 68%,var(--wash) 68%);
  box-shadow:inset 0 -1px 0 0 rgba(184,137,47,.45)}
/* a quiet source marker: this sentence came from the discourse, and here is where */
.src{font-family:'Inter',sans-serif;font-size:.55em;color:var(--gold);vertical-align:super;
  margin-left:.2em;cursor:pointer;opacity:.65;transition:.2s;font-weight:600}
.src:hover,.src.on{opacity:1}
body[data-src="off"] .src{display:none}

p.tr{display:none;font-style:italic;font-size:.92em;line-height:1.62;color:var(--soft);
  margin:-.65rem 0 1.35rem;padding-left:1rem;border-left:1px solid var(--rule)}

body[data-lang="mr"] p.tr{font-family:'EB Garamond',serif}
body[data-lang="en"] p.tr{font-family:'Tiro Devanagari Marathi',serif;font-style:normal;line-height:1.95}
body[data-lang="mr"] .essay p:not(.tr){font-family:'Tiro Devanagari Marathi',serif;line-height:2.05}
body[data-lang="mr"] .essay p.lead{line-height:1.95}

.pull{margin:1.9rem 0;padding:1.1rem 0 1.1rem 1.2rem;border-left:2px solid var(--gold)}
.pull .q{font-family:'Tiro Devanagari Marathi',serif;font-size:1.12rem;line-height:1.95;display:block}
.pull .t{display:block;margin-top:.5rem;font-style:italic;color:var(--soft);font-size:.95rem;line-height:1.55}

.close{margin-top:2.2rem;padding-top:1.4rem;border-top:2px solid var(--ember)}
.close .h{font-family:'Inter',sans-serif;font-size:.57rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ember);margin-bottom:.6rem}
.close .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin:0 0 1.1rem}
.step{border-top:1px solid var(--rule);padding-top:.55rem}
.step b{display:block;font-family:'Tiro Devanagari Marathi',serif;font-weight:400;font-size:1.15rem;
  color:var(--gold);margin-bottom:.15rem}
.step span{font-size:.85rem;line-height:1.45;color:var(--soft)}
@media(max-width:640px){.close .steps{grid-template-columns:1fr;gap:.6rem}}
.close p{margin:0;font-size:.95rem;line-height:1.6;color:var(--soft)}

.who{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);
  font-family:'Inter',sans-serif;font-size:.62rem;line-height:1.6;color:var(--faint)}
.who b{color:var(--ember);font-weight:600}

/* the check strip: what a marker points at */
.strip{position:fixed;left:50%;bottom:1.1rem;transform:translate(-50%,150%);z-index:40;
  width:min(40rem,calc(100vw - 2.5rem));background:var(--chip);border:1px solid var(--chip-bd);
  border-radius:12px;padding:.85rem 1.1rem;box-shadow:var(--shadow);opacity:0;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.strip.show{transform:translate(-50%,0);opacity:1}
.strip .h{font-family:'Inter',sans-serif;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);display:flex;justify-content:space-between;margin-bottom:.35rem}
.strip .h b{color:var(--faint);font-weight:400;cursor:pointer}
.strip .m{font-family:'Tiro Devanagari Marathi',serif;font-size:.98rem;line-height:1.85;margin:0}
.strip .e{margin:.35rem 0 0;font-style:italic;font-size:.88rem;line-height:1.5;color:var(--soft)}

@media print{
  [data-theme]{--desk:#fff;--paper:#fff;--bd:#fff;--ink:#1b1813;--soft:#4f483e;--rule:#d6cbb6;
    --gold:#8a6620;--ember:#8a4a20;--wash:#f6eeda;--shadow:none}
  body{background:#fff;padding:0;font-size:11.5pt}
  .bar,.strip{display:none}
  .sheet{box-shadow:none;border:0;max-width:none;padding:0}
}

<script>
const DATA = {"id": "01-02", "date": {"day": 2, "month": 1, "label_mr": "२ जानेवारी", "label_en": "2 January"}, "title_mr": "सद्गुरूकडून घेतलेलें नाम", "title_en": "The Name Received from the Sadguru", "footnote": {"marker": "२", "mr": "कोणतेंच कर्म यथासांग घडत नसतें; तरीपण मनुष्यानें संस्कार-कर्म शास्त्रप्रमाणें करून जेथें कमी पडेल तेथें भगवंताचें स्मरण करावें. भगवंताची श्रद्धा वाढावी हाच संस्कारांचा मूळ हेतु आहे.", "en": "No rite is ever performed perfectly; even so, one should carry out the prescribed observances according to the śāstra and, wherever they fall short, make up the lack by remembrance of God. That faith in God should grow is the root purpose of the observances."}, "paras": [[1, 6], [7, 9], [10, 14]], "sentences": [[1, "नाम हें सद्गुरूकडूनच घेणें जरूर आहे कां ? किंवा तें आपणच आपल्या आवडीप्रमाणें घेतलें तरी चालेल कां ?", "Is it necessary to receive the Name from a Sadguru? Or will it do to take it up oneself, according to one's own liking?", 0], [2, "भगवंताचें नांव स्वतःसिद्ध आहे व परिपूर्ण आहे; त्याला दुसऱ्या कोठूनहि पूर्णता प्राप्त होण्याची नसते.", "God's Name is self-established and complete in itself; it has no completeness to receive from anywhere else.", 1], [3, "सद्गुरूकडून घेतलेलें नाम व आपण स्वतःचे पसंतीनें घेतलेलें नाम ह्यांत फरक होऊं शकत नाहीं; कारण तसा फरक जर करूं लागलों तर एकाच सद्गुरूकडून घेतलेल्या नामांतहि फरक करावा लागेल.", "There can be no difference between the Name received from a Sadguru and the Name one takes up by one's own choice; for if we began making such distinctions, we should have to distinguish even between Names received from one and the same Sadguru.", 0], [4, "तसेंच सद्गुरु तरुण असतांना त्यानें दिलेलें नाम व म्हातारपणीं, किंवा देह सोडल्यानंतरहि दिलेलें नाम यांतहि फरक असूं शकत नाहीं.", "In the same way there can be no difference between the Name a Sadguru gave in his youth and the Name given in old age — or even after he has left the body.", 0], [5, "तरीसुद्धां सद्गुरूकडून घेतलेल्या नामाचें वैशिष्ट्य असें कीं, तो त्या नामाचे पाठीशीं संतरूपानें असतो, व आपल्याकडून नामस्मरण होण्याचे बाबतींत त्याची आपणांस फार मदत होते; व त्याचमुळें, आपल्या हातून होणारें नामस्मरण त्याचे सत्तेनें होत आहे ही जाणीव राहून, “मी नामस्मरण करतों” अशा तऱ्हेचा अहंकार होण्याला वाव राहात नाहीं.", "Even so, the particular virtue of the Name received from a Sadguru is this: he stands behind that Name in the form of a saint, and he helps us greatly in the matter of the remembrance actually happening through us; and because of that, the awareness remains that it is happening by his power, so there is no room for the pride of thinking “I am doing the remembrance.”", 1], [6, "म्हणूनच सद्गुरूकडून नाम घेणें जरूर आहे.", "That is precisely why it is necessary to receive the Name from a Sadguru.", 0], [7, "सद्गुरुभेट होईपर्यंत मात्र आपण नामस्मरण करीत राहणें जरूर आहे; कारण तेंच नामस्मरण सद्गुरूची भेट करवून देईल.", "Until that meeting with the Sadguru comes, however, we must go on remembering the Name; for it is that very remembrance which will bring the meeting about.", 1], [8, "आधीं संतांची भेट होणें कठीण; व समजा भेट झाली, तरी त्यांच्यावर विश्वास बसणें त्याहून कठीण असतें.", "Meeting a saint is hard to begin with; and supposing the meeting does happen, coming to trust him is harder still.", 0], [9, "म्हणून नामाचें साधन चालू ठेवावें.", "So keep the practice of the Name going.", 0], [10, "ज्याप्रमाणें खडीसाखर ठेवली म्हणजे मुंगळ्यांना आमंत्रण देण्याची जरूरी नसते, ते आपोआप तिचा शोध काढीत येतात, कारण ती त्यांना फार आवडते; त्याप्रमाणें तुम्ही खडीसाखर बना, म्हणजे संत तुमच्याकडे धांवतच येतील.", "Just as, when rock sugar is set out, there is no need to invite the ants — they come searching it out of their own accord, because they love it so much — in the same way, become rock sugar, and saints will come running to you.", 0], [11, "‘खडीसाखर बना’ म्हणजे संतांना आवडेल असें वर्तन करा.", "‘Become rock sugar’ means: behave in a way that saints will love.", 0], [12, "संतांना काय आवडतें ?", "And what is it that saints love?", 0], [13, "भगवंताचें अनुसंधान व अखंड नामस्मरण याशिवाय त्यांना कोणतीहि गोष्ट प्रिय नाहीं.", "Nothing whatever is dear to them except unbroken attention to God and ceaseless remembrance of the Name.", 1], [14, "म्हणून आपल्या हृदयामध्यें अखंड नामाची ज्योत तेवत ठेवा, सद्गुरु तुमचा शोध घेत येतील व तुमच्यावर कृपेचा वर्षाव करतील.", "So keep the flame of the unbroken Name burning in your heart; the Sadguru will come seeking you, and will pour his grace upon you.", 1]], "groups": {}, "points": [], "page_image": "source/pages/01-02.jpg", "marks": {"kind": "inherited", "by": "an unidentified previous reader of this copy", "count_passages": 5, "detected_by": "read from the scan in-session; sentence 13 added after three models flagged it", "confirmed_by_human": false, "uncertain": [8], "note": "Sentence 13 was missed on the first reading — its underline runs across a row break and was mistaken for sentence 14's. Three independent models caught it. Sentence 8 remains unsettled."}, "has_footnote": true};
</script>
<script>
const SUMMARY = {"id": "01-02", "status": {"state": "draft", "author": null, "reviewed_by_marathi_editor": false, "reviewed_by_publisher": false, "note": "Written in-session from the underlined passages. Redrafted after sentence 13 was found to be underlined. Marathi connective prose needs a native editor."}, "essay": [{"lead": true, "mr": "प्रश्न साधा आहे — नाम सद्गुरूकडूनच घ्यावें लागतें कां? उत्तरहि साधें आहे: <strong>भगवंताचें नांव स्वतःसिद्ध आहे व परिपूर्ण आहे; त्याला दुसऱ्या कोठूनहि पूर्णता प्राप्त होण्याची नसते</strong>{{2}}.", "en": "The question is a plain one — must the Name be received from a Sadguru? The answer is plain too: <strong>God's Name is self-established and complete in itself; it has no completeness to receive from anywhere else</strong>{{2}}."}, {"mr": "म्हणजे सद्गुरु नामांत कांहीं भर घालत नाहीं. मग तो देतो काय?", "en": "So the Sadguru adds nothing to the Name. Then what is it that he gives?"}, {"pull": 5}, {"mr": "<strong>तो त्या नामाचे पाठीशीं संतरूपानें असतो</strong>, आणि त्यामुळें “मी नामस्मरण करतों” अशा तऱ्हेचा अहंकार होण्याला वाव राहात नाहीं{{5}}. नाम तेंच राहतें; बदलतो तो घेणारा.", "en": "<strong>He stands behind that Name in the form of a saint</strong>, and because of that there is no room left for the pride of thinking “I am doing the remembrance”{{5}}. The Name stays the same; what changes is the one taking it."}, {"mr": "पण सद्गुरु अजून भेटला नसेल तर? <strong>सद्गुरुभेट होईपर्यंत आपण नामस्मरण करीत राहणें जरूर आहे; कारण तेंच नामस्मरण सद्गुरूची भेट करवून देईल</strong>{{7}}. वाट पाहणें ही अट नाहीं — नामच तो मार्ग आहे.", "en": "But what if the Sadguru has not yet been met? <strong>Until that meeting comes, we must go on remembering the Name; for it is that very remembrance which will bring the meeting about</strong>{{7}}. Waiting is not a precondition — the Name is itself the road."}, {"mr": "आणि संतांचें मापहि तेंच आहे — <strong>भगवंताचें अनुसंधान व अखंड नामस्मरण याशिवाय त्यांना कोणतीहि गोष्ट प्रिय नाहीं</strong>{{13}}.", "en": "And that is the measure of the saints too — <strong>nothing whatever is dear to them except unbroken attention to God and ceaseless remembrance of the Name</strong>{{13}}."}, {"mr": "म्हणून शोधायला निघण्याची गरज नाहीं. <strong>आपल्या हृदयामध्यें अखंड नामाची ज्योत तेवत ठेवा, सद्गुरु तुमचा शोध घेत येतील</strong>{{14}}.", "en": "So there is no need to set out searching. <strong>Keep the flame of the unbroken Name burning in your heart; the Sadguru will come seeking you</strong>{{14}}."}], "begin_today": {"heading_mr": "आजची सुरुवात", "heading_en": "begin today", "steps": [{"word": "चालू ठेवा", "mr": "भेटीची वाट न पाहतां नामस्मरण चालू ठेवावें.", "en": "Go on with the Name without waiting for the meeting."}, {"word": "ज्योत जपा", "mr": "हृदयांत अखंड नामाची ज्योत तेवत ठेवावी.", "en": "Tend the flame — keep it unbroken in the heart."}, {"word": "“मी” सोडा", "mr": "नामस्मरण त्याच्या सत्तेनें होतें; कर्तेपण आपलें नाहीं.", "en": "The remembrance happens by his power; the doing is not yours."}], "close_mr": "सद्गुरूचा शोध घ्यायला निघावें लागत नाहीं; ज्योत तेवती ठेवली कीं तेच येतात.", "close_en": "You do not have to go looking for the Sadguru. Keep the flame lit, and he comes."}, "practice_actions": [{"sentence": 7, "today": "Do not postpone the Name until you have a teacher. Today's remembrance is what brings the teacher."}, {"sentence": 14, "today": "Return to it often enough that it never quite goes out — a flame, not an appointment."}, {"sentence": 5, "today": "When you notice the thought \\u201cI am doing this\\u201d, let it go and carry on."}]};
</script>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dev=n=>String(n).replace(/\d/g,d=>'०१२३४५६७८९'[d]);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
             set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const byN={}; DATA.sentences.forEach(([n,mr,en,hl])=>byN[n]={mr,en,hl});

document.getElementById('dl').textContent=DATA.date.label_mr+'  ·  '+DATA.date.label_en;
document.getElementById('tmr').textContent=DATA.title_mr;
document.getElementById('ten').textContent=DATA.title_en;

/* The summary text lives in summary/days/<id>.json and is injected at build time.
   {{n}} in that text becomes a tappable source marker pointing at sentence n. */
const mark=h=>h.replace(/\{\{(\d+)\}\}/g,(_,n)=>`<i class="src" data-s="${n}">${n}</i>`);
const ESSAY=SUMMARY.essay.map(p=>p.pull?{pull:p.pull}:{lead:p.lead,mr:mark(p.mr),en:mark(p.en)});

const essayEl=document.getElementById('essay');
function renderEssay(){
  const mr=document.body.dataset.lang==='mr';
  essayEl.innerHTML=ESSAY.map(p=>{
    if(p.pull){
      const s=byN[p.pull];
      return `<div class="pull"><span class="q">${esc(s.mr)}</span>
              <span class="t">${esc(s.en)}</span></div>`;
    }
    const main=mr?p.mr:p.en, other=mr?p.en:p.mr;
    const strip=h=>h.replace(/<i class="src"[^>]*>\d+<\/i>/g,'');
    return `<p class="${p.lead?'lead':''}">${main}</p><p class="tr">${strip(other)}</p>`;
  }).join('');
}
/* every marker must point at a sentence that is actually underlined */
function audit(){
  const used=[...document.querySelectorAll('.src')].map(e=>+e.dataset.s);
  const bad=used.filter(n=>!byN[n]||!byN[n].hl);
  const mr=document.body.dataset.lang==='mr';
  document.getElementById('who').innerHTML = mr
   ? `<b>या आवृत्तीसाठीं लिहिलेलें.</b> हा सारांश आहे, प्रवचन नव्हे — ${dev(used.length)} मुद्दे,
      प्रत्येक एका अधोरेखित वाक्यावरून; अंक दाबल्यास मूळ वाक्य दिसतें. जोडणारीं वाक्यें आमचीं आहेत.
      मसुदा · नाव नाहीं · मराठी जाणकारानें वा प्रकाशकानें तपासलेलें नाहीं.
      ${bad.length?'<br><b>इशारा:</b> '+bad.length+' अंक अधोरेखित नसलेल्या मजकुराकडे बोट दाखवतो.':''}
      <br>पूर्ण प्रवचन ${dev(DATA.sentences.length)} वाक्यांचें आहे; तें आधीं वाचावें.`
   : `<b>Written for this edition.</b> This is a summary, not the discourse — ${used.length}
      claims, each drawn from a passage a previous reader underlined, marked with a number you can
      tap to see the original. The connecting sentences are ours. Draft · unattributed ·
      not reviewed by a Marathi scholar or by the publisher.
      ${bad.length?'<br><b>Warning:</b> '+bad.length+' marker(s) cite text that is not underlined.':''}
      <br>The full discourse is ${DATA.sentences.length} sentences; read it before this.`;
}
function renderChrome(){
  const mr=document.body.dataset.lang==='mr';
  const st=SUMMARY.begin_today.steps;
  document.querySelectorAll('.step').forEach((el,i)=>{
    if(!st[i])return;
    el.querySelector('b').textContent=st[i].word;
    el.querySelector('span').textContent=mr?st[i].mr:st[i].en;});
  document.getElementById('closeP').textContent = mr
   ? SUMMARY.begin_today.close_mr : SUMMARY.begin_today.close_en;
}
function render(){renderEssay();renderChrome();audit();}

const strip=document.getElementById('strip');
document.getElementById('stripX').onclick=()=>{strip.classList.remove('show');
  document.querySelectorAll('.src.on').forEach(e=>e.classList.remove('on'))};
document.addEventListener('click',e=>{
  const m=e.target.closest('.src'); if(!m) return;
  const s=byN[m.dataset.s]; if(!s) return;
  document.querySelectorAll('.src.on').forEach(x=>x.classList.remove('on'));
  m.classList.add('on');
  document.getElementById('stripH').textContent='वाक्य '+dev(m.dataset.s)+' · sentence '+m.dataset.s+
    (s.hl?' · underlined':'');
  document.getElementById('stripM').textContent=s.mr;
  document.getElementById('stripE').textContent=s.en;
  strip.classList.add('show');
});

const THEMES=['day','sepia','night'];
function setTheme(t){document.documentElement.dataset.theme=t;store.set('pravachane-theme',t)}
setTheme(store.get('pravachane-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'));
document.getElementById('bTheme').onclick=()=>
  setTheme(THEMES[(THEMES.indexOf(document.documentElement.dataset.theme)+1)%3]);
document.getElementById('lang').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.body.dataset.lang=b.dataset.lang;
  document.querySelectorAll('#lang button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  strip.classList.remove('show'); render();
});
document.getElementById('bTr').onclick=e=>{
  const on=document.body.dataset.tr==='off';
  document.body.dataset.tr=on?'on':'off'; e.target.classList.toggle('on',on)};
document.getElementById('bSrc').onclick=e=>{
  const on=document.body.dataset.src==='off';
  document.body.dataset.src=on?'on':'off'; e.target.classList.toggle('on',on)};
document.getElementById('bPrint').onclick=()=>print();
addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')document.getElementById('bTheme').click()});

render();
(function(){const q=new URLSearchParams(location.search);
  if(q.get('theme'))setTheme(q.get('theme'));
  if(q.get('lang')==='en')document.querySelector('#lang button[data-lang="en"]').click();
  if(q.get('tr')==='on')document.getElementById('bTr').click();})();
</script>
</body>
</html>
